# per-day rate kept equal to Client A so only the notice term differs.
client:
  client_id: CLC
  legal_name: Charlie Demo Petro Products Ltd
  aliases: ["Charlie Demo Petro"]
  lanes: [PUNE-KOLHAPUR]

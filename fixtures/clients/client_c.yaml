             measured_from: delivery_due_at, measured_to: arrival_at}
    page: 31
    clause_ref: "8(d)"
    verbatim: "The Corporation shall levy penalty on the carrier @ Rs. 2000/- per day of delay, a part of a day being counted as a full day, recovered from the bills."

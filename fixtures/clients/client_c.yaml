    agreement_id: CLC-TSA-2026
    client_id: CLC
    term_type: notice
    params: {deadline_hours: 24, immediate: false, method: "email or fax", addressee: "Location in-charge", applies_to: force_majeure}
    page: 32
    clause_ref: "14"
    verbatim: "The carrier shall notify the occurrence of force majeure to the Corporation within 24 hours of its occurrence."

# Client B: stand-in, CWC style. FM covers war, riots, floods, unexpected government acts;
# EXCLUDES strikes and agitations; notice within 48 hours.
# Sources: CWC model tender cl.13 p.7 (rate) and cl.20.1-20.2 pp.41-42 (FM, 48 h) (D6);
# exclusion wording extended to agitations for the stand-in (CWC excludes strikes).
client:
  client_id: CLB
  legal_name: Bravo Demo Warehousing Ltd
  aliases: ["Bravo Demo Warehousing"]
  lanes: [PUNE-KOLHAPUR]
  approvers: {kam: "kam.demo", finance: "finance.demo", legal: "legal.demo"}
agreements:
  - agreement_id: CLB-TSA-2026
    client_id: CLB
    doc_type: transport_service_agreement
    precedence_rank: 1
    title: "Stand-in Handling and Transport Contract, Bravo Demo Warehousing (built from D6 clauses)"
    file_ref: fixtures/terms/sample_agreement_client_b.txt
    effective_from: "2026-04-01"
    effective_to: "2027-03-31"
    lanes: [PUNE-KOLHAPUR]
    completeness: complete
    is_stand_in: true
    confirmed_by: kam.demo
    confirmed_at: "2026-09-01T10:00:00+05:30"
terms:
  - term_id: CLB-PEN-1
    agreement_id: CLB-TSA-2026
    client_id: CLB
    term_type: penalty_rule
    params: {event: late_delivery, rate: "2000", unit: flat_per_day, base: none,
             part_unit_counts_as_full: true, day_count: calendar,
             measured_from: delivery_due_at, measured_to: arrival_at}
    page: 7
    clause_ref: "13"
    verbatim: "Liquidated Damages from the Service Provider @ Rs.2000/- per day of delay in delivery beyond the due date, a part of a day being counted as a full day."
    effective_from: "2026-04-01"
    extraction_confidence: 1.0
    status: confirmed
    confirmed_by: kam.demo
    confirmed_at: "2026-09-01T10:00:00+05:30"
  - term_id: CLB-FM-1
    agreement_id: CLB-TSA-2026
    client_id: CLB
    term_type: force_majeure
    params: {events_named: [riot, flood, road_closure], general_words: [],
             events_excluded: [strike, agitation], relief: excuse_delay}
    page: 41
    clause_ref: "20.1-20.2"
    verbatim: "Force majeure shall mean war, riots, floods and natural disasters (other than ordinary weather), fire and unexpected acts of Government. Strikes, agitations or lockouts, whether by the Service Provider's staff, its sub-contractors or any other persons, shall not be treated as force majeure."
    effective_from: "2026-04-01"
    extraction_confidence: 1.0
    status: confirmed
    confirmed_by: kam.demo
    confirmed_at: "2026-09-01T10:00:00+05:30"
  - term_id: CLB-NOT-1
    agreement_id: CLB-TSA-2026
    client_id: CLB
    term_type: notice
    params: {deadline_hours: 48, immediate: false, method: writing, addressee: "Regional Manager", applies_to: force_majeure}
    page: 42
    clause_ref: "20.2"
    verbatim: "The Service Provider shall intimate the occurrence of force majeure in writing to the Regional Manager within 48 hours."
    effective_from: "2026-04-01"
    extraction_confidence: 1.0
    status: confirmed
    confirmed_by: kam.demo
    confirmed_at: "2026-09-01T10:00:00+05:30"

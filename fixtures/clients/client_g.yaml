# Client G: stand-in public buyer on GeM.
# Penalty and cap: GeM SLA Goods Transport Service, section 8 item 1 (D2):
#   1% of trip cost per vehicle per day, "subject to the maximum of 15% of the trip cost for each vehicle".
#   (D2's second cap, 10% of contract value in total, is left out of the stand-in: no contract
#   value is held, and a per-contract cap would need every deduction under the contract.)
# Buyer-caused delay: GeM GTC 4.0 cl.15(i) p.34 (D1) "delay attributable to the Buyer / Consignee";
#   SOP loading time of 4 hours is a stand-in annex value.
# Force majeure: D2 10.1 lists NO events (notify cause, evidence and effect; no deadline), so a
#   delay for this client never triggers a discovery search (DESIGN 5.5: nothing named -> NOT_APPLICABLE).

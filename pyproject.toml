[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdr"
version = "0.1.0"
description = "Penalty-deduction recovery service for 3PLs"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "typer>=0.12",
  "trafilatura>=1.8",
  "pypdf>=4.0",
  "openpyxl>=3.1",
  "jinja2>=3.1",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pdr = "pdr.cli:app"

[tool.setuptools.packages.find]
include = ["pdr*"]

[tool.setuptools.package-data]
pdr = ["prompts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
